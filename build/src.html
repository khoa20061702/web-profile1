<style>
/*FONTS*/
@property --mt{syntax:'<length>';inherits:true;initial-value:0px}
@property --m0{syntax:'<length>';inherits:true;initial-value:0px}
@property --mb{syntax:'<length>';inherits:true;initial-value:0px}

:root{
  --n:min(calc(100vw / 1440),calc(100vh / 900));--glide:1.6s;--th:180px;--mbs:.2;
  /* dark (default) */
  --bg:#0a0a0a;--fg:#f4f4f4;--fg-soft:rgba(244,244,244,.74);--line:rgba(255,255,255,.3);
  --stage:radial-gradient(120% 95% at 50% 18%,#2b2b2b 0%,#121212 55%,#000 100%);
  --glass:rgba(22,22,22,.42);--glass-line:rgba(255,255,255,.14);--glass-hover:rgba(255,255,255,.1);--glass-shadow:0 12px 34px rgba(0,0,0,.35);
  --w1:#ffffff;--w2:#e4e4e4;--w2o:.9;--w3:#8f8f8f;--w3o:.22;
  --tk-bg:#f4f4f4;--tk-fg:#0d0d0d;--hole:#161616;
  --plate-filter:grayscale(1) brightness(.85);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f3f3;--fg:#0d0d0d;--fg-soft:rgba(13,13,13,.74);--line:rgba(0,0,0,.22);
  --stage:radial-gradient(120% 95% at 50% 18%,#ffffff 0%,#ededed 55%,#d4d4d4 100%);
  --glass:rgba(255,255,255,.5);--glass-line:rgba(0,0,0,.1);--glass-hover:rgba(0,0,0,.06);--glass-shadow:0 12px 34px rgba(0,0,0,.12);
  --w1:#0d0d0d;--w2:#262626;--w2o:.88;--w3:#6b6b6b;--w3o:.18;
  --tk-bg:#0d0d0d;--tk-fg:#f4f4f4;--hole:#e2e2e2;
  --plate-filter:grayscale(1) brightness(1.25) contrast(.92);
  color-scheme:light;
}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0;background:var(--bg)}
body{font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--fg);overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
img{-webkit-user-drag:none}
.js .pre{opacity:0}

/* ---------- stage + frame ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--stage)}
.caseplate{filter:var(--plate-filter)}
.frame{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;--m0:0px;--mt:0px;--mb:0px;--ms:0px}
.frame.glide{transition:
  transform var(--glide) cubic-bezier(.65,0,.35,1),
  --m0 var(--glide) cubic-bezier(.65,0,.35,1),
  --mt var(--glide) cubic-bezier(.65,0,.35,1),
  --mb var(--glide) cubic-bezier(.65,0,.35,1),
  --ms var(--glide) cubic-bezier(.65,0,.35,1)}
.frame.d-fade.m-case{--m0:0px;--mt:110px;--mb:60px;--ms:170px}
.frame.m-fade{--m0:0px;--mt:190px;--mb:0px;--ms:140px}
.frame.m-fade.m-case{--m0:48px;--mt:40px;--mb:70px;--ms:140px}
.frame>*{position:absolute}
.cut{left:460px;top:30px;width:520px;height:780px;display:block;z-index:4;transform-origin:50% 100%}
.wm{left:0;top:0;width:1440px;height:260px;overflow:visible;z-index:3}
.caseplate{left:0;top:-105.47px;width:1440px;height:956.25px;opacity:0;z-index:7;--o:105.47px;--ob:40.78px}
.caseplate{
  -webkit-mask-image:
    linear-gradient(180deg,
      transparent calc(var(--o,0px) + var(--m0)),
      rgba(0,0,0,.35) calc(var(--o,0px) + var(--m0) + var(--mt)*.37),
      #000 calc(var(--o,0px) + var(--m0) + var(--mt)),
      #000 calc(100% - var(--ob,0px) - var(--mb)),
      transparent calc(100% - var(--ob,0px))),
    linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  mask-image:
    linear-gradient(180deg,
      transparent calc(var(--o,0px) + var(--m0)),
      rgba(0,0,0,.35) calc(var(--o,0px) + var(--m0) + var(--mt)*.37),
      #000 calc(var(--o,0px) + var(--m0) + var(--mt)),
      #000 calc(100% - var(--ob,0px) - var(--mb)),
      transparent calc(100% - var(--ob,0px))),
    linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
}
.screen{left:272.8px;top:102.7px;width:894.4px;height:604.7px;border-radius:3px;background:#000;overflow:hidden;opacity:0;z-index:8}
.term{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;padding:30px 38px 28px;text-align:left;
  background:radial-gradient(120% 90% at 50% 0%,#1d1d1d 0%,#0b0b0b 70%);color:#f2f2f2;font-family:'Inter Tight',sans-serif}
.term .ln{opacity:0}
.term.run .ln{animation:ln .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 45ms + 200ms)}
@keyframes ln{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.s-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.s-h b{font-size:13px;letter-spacing:.22em;font-weight:800}
.s-h span{font-size:13px;color:#8a8a8a;font-weight:500}
/* stack */
.stack{flex:1;display:flex;gap:30px}
.stack .col{flex:1;display:flex;flex-direction:column;gap:16px}
@media (min-width:821px){.stack .col + .col{padding-top:112px}.cards{margin-top:auto}}
.grp h5{margin:0 0 10px;font-size:11.5px;letter-spacing:.2em;color:#9a9a9a;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{width:78px;height:86px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:11.5px;font-weight:600;color:#dcdcdc;white-space:nowrap}
.tile img{width:38px;height:38px;display:block}
.tile img.inv{filter:invert(1)}
.tile .tx{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:#f2f2f2;color:#0b0b0b;font-weight:800;font-size:10px;letter-spacing:.02em}
/* academics */
.gpa{display:flex;align-items:flex-end;gap:18px;margin:6px 0 4px}

.major{margin:14px 0 22px;font-size:15px;color:#bdbdbd;font-weight:500}
.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto}
.course{border-radius:14px;padding:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.course small{display:block;font-size:10.5px;letter-spacing:.16em;color:#8a8a8a;font-weight:700;margin-bottom:8px}
.course strong{display:block;font-size:17px;font-weight:700;margin-bottom:6px}
.course span{font-size:12.5px;color:#a8a8a8}
/* strengths */
.lead{max-width:62%;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:4px 0 18px}
.lead em{font-style:normal;color:#8a8a8a}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card2{border-radius:14px;padding:16px 18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:8px}
.card2 svg{width:28px;height:28px;fill:none;stroke:#f2f2f2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
.card2 strong{font-size:17px;font-weight:700}
.card2 span{font-size:13px;line-height:1.4;color:#a8a8a8}
.screen::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 38%)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:2}

/* ---------- hero: script ---------- */

/* ---------- hero: badge ---------- */
.badge{position:absolute;width:582px;height:1030px;left:986px;top:-165px;transform-origin:288px 0;pointer-events:none;z-index:5}
.badge>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.card{position:absolute;left:172px;top:536px;width:238px;height:392px;padding:20px 16px 0 16px;color:#141615;font-family:'Inter Tight',sans-serif}
.card h4{margin:0;font-size:30px;line-height:.95;font-weight:800;letter-spacing:-.5px}
.card .yr{position:absolute;right:16px;top:62px;font-size:11px;font-weight:700}
.card .role{margin-top:12px;padding-top:5px;border-top:1px solid #222;font-size:9.5px;font-weight:700;letter-spacing:.2px}
.card .ph{width:92px;height:112px;margin:12px auto;border-radius:6px;background-color:#dfe4e1;background-size:cover;background-position:50% 30%;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;font-weight:700;padding:6px 0 3px;border-bottom:1.5px dotted #333}
.card .row b{font-weight:600}
.badge .hit{position:absolute;left:160px;top:470px;width:262px;height:440px;pointer-events:auto;cursor:grab}

/* ---------- viewport UI ---------- */
.ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.ui>*{position:absolute}
.m-only{display:none}
.navbar{left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 24px);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  pointer-events:auto;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;white-space:nowrap;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.nl{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;color:var(--fg);text-decoration:none;
  font-weight:600;font-size:14px;letter-spacing:-.01em;transition:background-color .25s,color .25s}
.nl:hover{background:var(--glass-hover)}
body:not(.is-case) .nl.t1,body.is-case .nl.t2{background:var(--fg);color:var(--bg)}
.nl .short{display:none}
.navbar .sep{width:1px;height:20px;background:var(--glass-line);margin:0 4px}
.theme{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:background-color .25s}
.theme:hover{background:var(--glass-hover)}
.theme svg{grid-area:1/1;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.theme .sun{opacity:0;transform:rotate(-90deg) scale(.5)}
:root[data-theme="light"] .theme .sun{opacity:1;transform:none}
:root[data-theme="light"] .theme .moon{opacity:0;transform:rotate(90deg) scale(.5)}
.lang{height:38px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--fg);transition:background-color .25s}
.lang:hover{background:var(--glass-hover)}
.lang span{opacity:.4;transition:opacity .25s}
.lang i{width:1px;height:12px;background:var(--glass-line)}
:root[lang="en"] .lang [data-l="en"],:root[lang="vi"] .lang [data-l="vi"]{opacity:1}
.nl:focus-visible,.lang:focus-visible,.theme:focus-visible,.logo:focus-visible,.nav-case:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.logo{left:50%;top:calc(14*var(--n));transform:translateX(-50%);font-weight:600;font-size:calc(19*var(--n));letter-spacing:.14em;opacity:0;transition:opacity .4s;pointer-events:none}
body.is-case .logo{opacity:1;pointer-events:auto}

.hint{left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(10*var(--n));
  font-size:calc(12*var(--n));letter-spacing:.18em;text-transform:uppercase;font-weight:600;opacity:.85;white-space:nowrap}
.hint .line{position:relative;width:calc(1.5*var(--n));height:calc(22*var(--n));background:var(--line);overflow:hidden}
.hint .line::after{content:'';position:absolute;left:0;top:-40%;width:100%;height:40%;background:var(--fg);animation:drip 1.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes drip{to{top:100%}}
body.is-case .hint,body.busy .hint{visibility:hidden}

/* ---------- case UI ---------- */
.ticket{right:calc(32*var(--n));top:calc(98*var(--n));width:calc(348*var(--n));height:calc(182*var(--n));background:var(--tk-bg);color:var(--tk-fg);
  border-radius:calc(3*var(--n));box-shadow:0 calc(18*var(--n)) calc(40*var(--n)) rgba(0,0,0,.28);
  padding:calc(26*var(--n)) calc(34*var(--n)) 0 calc(44*var(--n));transform-origin:50% 0;opacity:0}
.ticket .hole{position:absolute;width:calc(21*var(--n));height:calc(21*var(--n));border-radius:50%;background:var(--hole);box-shadow:inset 0 calc(2*var(--n)) calc(3*var(--n)) rgba(0,0,0,.35)}
.hole.a{left:calc(12*var(--n));top:calc(12*var(--n))}
.hole.b{right:calc(12*var(--n));top:calc(12*var(--n))}
.hole.c{left:calc(12*var(--n));bottom:calc(12*var(--n))}
.hole.d{right:calc(12*var(--n));bottom:calc(12*var(--n))}
.ticket h2{margin:0;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:calc(50*var(--n));line-height:1;letter-spacing:-.01em;white-space:nowrap}
.ticket .rows{margin-top:calc(8*var(--n))}

.desc{left:calc(28*var(--n));top:calc(326*var(--n));width:calc(214*var(--n));padding:calc(20*var(--n));border-radius:calc(16*var(--n));background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);opacity:0;transition:opacity .4s}
body.is-case .desc{opacity:1}
.desc>*{opacity:0}
.desc .k{font-weight:700;font-size:calc(17*var(--n));letter-spacing:-.02em}
.desc p{margin:calc(14*var(--n)) 0 0;font-size:calc(15*var(--n));line-height:1.36;font-weight:500;color:var(--fg-soft)}
.desc .num{margin-top:calc(22*var(--n));font-size:calc(12*var(--n));letter-spacing:.16em;font-weight:700;color:var(--fg-soft)}

.nav-case{bottom:calc(150*var(--n));display:flex;flex-direction:column;align-items:center;gap:calc(9*var(--n));opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility .3s}
body.is-case .nav-case{opacity:1;visibility:visible;pointer-events:auto}
body.is-case .nav-case.dim{opacity:.45}
.nav-case.prev{left:calc(95*var(--n))}
.nav-case.next{right:calc(95*var(--n))}
.nav-case .c{width:calc(50*var(--n));height:calc(50*var(--n));border-radius:50%;border:1.6px solid var(--fg);display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s}
.nav-case svg{width:calc(24*var(--n));height:calc(24*var(--n));fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-case .l{font-weight:600;font-size:calc(15*var(--n));line-height:1.05;text-align:center}
.nav-case.next .c{background:var(--fg);color:var(--bg)}
.nav-case.next:hover .c{background:var(--fg-soft)}
.nav-case:hover .c{transform:scale(1.08)}

/* ---------- small screens ---------- */
@media (max-width:820px){
  .frame .wm,.frame .script,.frame .badge{display:none}
  .m-only{display:block}

  .navbar{gap:2px;padding:4px}
  .nl{height:36px;padding:0 11px;font-size:12.5px}
  .nl .full{display:none}
  .nl .short{display:inline}
  .navbar .sep{margin:0 2px}
  .theme{width:36px;height:36px}
  .lang{height:36px;padding:0 8px;gap:5px;font-size:11.5px}
  .logo{display:none}

  .m-wm{left:3vw;width:94vw;height:calc(94vw * 240 / 1440);top:calc(22px);overflow:visible}
  .m-script{right:6vw;top:calc(22px + 14vw);font-family:'Caveat Brush',cursive;font-size:10vw;line-height:1;color:var(--fg);letter-spacing:-.5px;white-space:nowrap;transform:rotate(-7deg);text-shadow:0 2px 10px rgba(0,0,0,.2)}
  .m-badge{right:2vw;top:calc(22px + 9vw);width:27vw;height:calc(27vw * 1030 / 582);z-index:-1}
  .m-badge .badge{left:0;top:0;scale:var(--mbs);translate:calc(-288px + 13.5vw) 0}

  .ticket{left:0;right:0;margin:0 auto;top:20px;width:min(86vw,360px);height:auto;padding:22px 26px 16px 36px;border-radius:3px;box-shadow:0 12px 28px rgba(0,0,0,.28)}
  .ticket .hole{width:15px;height:15px;box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
  .hole.a{left:9px;top:9px}.hole.b{right:9px;top:9px}.hole.c{left:9px;bottom:9px}.hole.d{right:9px;bottom:9px}
  .ticket h2{font-size:38px}
  .ticket .rows{margin-top:6px}
  .ticket .rows div{font-size:11px;padding:4px 0 3px}

  .desc{left:0;right:0;margin:0 auto;width:min(86vw,360px);top:calc(20px + var(--th) + 18px);padding:14px 16px;border-radius:14px;text-align:center}
  .desc .k{font-size:15px}
  .desc p{margin-top:6px;font-size:13.5px}
  .desc .num{display:none}

  .nav-case{bottom:calc(env(safe-area-inset-bottom,0px) + 80px);flex-direction:row;gap:10px}
  .nav-case.prev{left:6vw}
  .nav-case.next{right:6vw;flex-direction:row-reverse}
  .nav-case .c{width:42px;height:42px}
  .nav-case svg{width:20px;height:20px}
  .nav-case .l{font-size:12.5px;white-space:nowrap}
  .nav-case .l br{display:none}

  .hint{bottom:calc(80px + env(safe-area-inset-bottom,0px));font-size:11px;gap:8px}
  .hint .line{width:1.5px;height:20px}
}

@media (max-width:420px){
  .nl{padding:0 9px;font-size:12px}
  .nl.t4{display:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .term .ln{opacity:1}
}
</style>
</head>
<body>

<div class="stage">
  <div class="frame d-fade">
    <svg class="wm pre" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="wmg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--w1)"/>
          <stop offset=".5" style="stop-color:var(--w2);stop-opacity:var(--w2o)"/>
          <stop offset="1" style="stop-color:var(--w3);stop-opacity:var(--w3o)"/>
        </linearGradient>
      </defs>
      <text x="14" y="214" textLength="1412" lengthAdjust="spacingAndGlyphs" fill="url(#wmg)" style="font-family:'Inter Tight',sans-serif;font-weight:900;font-size:268px;letter-spacing:-6px">DANG KHOA</text>
    </svg>
    <img class="cut pre" alt="Nguyen Dang Khoa" decoding="async">
    <div class="badge pre">
      <img alt="" decoding="async">
      <div class="card">
        <h4>DEVELOPER<br>CARD</h4>
        <div class="yr">2026</div>
        <div class="role">BACKEND DEVELOPER // API</div>

          k: '// công nghệ', d: '— ngôn ngữ và công cụ tôi dùng, từ API, cơ sở dữ liệu đến giao diện.' },

  };
  let LANG = document.documentElement.lang === 'vi' ? 'vi' : 'en';
  const L = () => I18N[LANG];

  let li = 0; // running stagger index
  const ln = (cls, inner) => '<div class="ln ' + cls + '" style="--i:' + (li++) + '">' + inner + '</div>';
  const head = l => (li = 0, ln('s-h', '<b>' + esc(l) + '</b>'));

  const grp = g => '<div class="grp"><h5>' + esc(L().groups[g]) + '</h5><div class="tiles">' + TECH[g].map(tile).join('') + '</div></div>';

  const slideAcademics = () => head(L().acadTitle) +

    '<div class="courses">' + L().courses.map(([c, p, t]) =>
      ln('course', '<small>' + esc(c) + '</small><strong>' + esc(p) + '</strong><span>' + esc(t) + '</span>')).join('') + '</div>';

    ln('lead', L().lead) +
    '<div class="cards">' + L().strengths.map(([t, d], i) =>

  const SLIDES = [slideStack, slideAcademics, slideStrengths];
  let CASES = L().cases;

  /* ---------- refs ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const root = document.documentElement, body = document.body;
  const stage = $('.stage'), frame = $('.frame');
  const cut = $('.cut', frame), caseplate = $('.caseplate', frame);
  const screen = $('.screen', frame), flash = $('.flash', frame);
  const vids = $$('.screen .term', frame);
  const wm = $('.wm', frame), script = $('.script', frame), badge = $('.badge', frame);
  const ticket = $('.ticket'), desc = $('.desc'), descKids = Array.from(desc.children);
  const navbar = $('.navbar'), hint = $('.hint'), logo = $('.logo'), themeBtn = $('.theme');
  const prevBtn = $('.nav-case.prev'), nextBtn = $('.nav-case.next');
  const mBadge = $('.m-badge');

  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EZ = 'cubic-bezier(.2,.8,.2,1)';
  const D = ms => RM ? 0 : ms;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const mob = () => innerWidth <= 820;

  /* animate with defaults; durations scale to 0 under reduced motion */
  const an = (el, kf, o = {}) => el.animate(kf, Object.assign({ easing: EZ, fill: 'both' }, o, {
    duration: D(o.duration || 0), delay: D(o.delay || 0)
  }));
  const clr = el => el.getAnimations().forEach(a => { if (a.effect && a.effect.target === el) a.cancel(); });
  const done = a => a.finished.catch(() => {});
  const pf = () => getComputedStyle(document.documentElement).getPropertyValue('--plate-filter').trim() || 'none';

  /* ---------- wire assets ---------- */
  $('img', badge).src = A.badge;
  $('.ph', badge).style.backgroundImage = 'url("data:image/jpeg;base64,/*ME*/")';
  const mBadgeInner = badge.cloneNode(true);
  mBadge.appendChild(mBadgeInner);

  const WM = [wm, $('.m-wm')], SC = [script, $('.m-script')], BD = [badge, mBadgeInner];

  const renderSlides = () => vids.forEach((v, i) => { v.innerHTML = SLIDES[i](); });

  const plateLoaded = new Promise(r => {
    cut.addEventListener('load', r, { once: true });
    cut.addEventListener('error', r, { once: true });
  });
  cut.src = A.me;
  caseplate.src = A.casePlate;

  /* ---------- state ---------- */
  let mode = 'hero', poseMode = 'hero', busy = false, cur = 0;
  const setBusy = b => { busy = b; body.classList.toggle('busy', b); };

  /* ---------- frame fitting ---------- */
  function setN() {
    const W = innerWidth, H = innerHeight;
    root.style.setProperty('--n', (mob() ? W / 430 : Math.min(W / 1440, H / 900)) + 'px');
  }

  function pose(m) {
    const W = innerWidth, H = innerHeight;
    if (!mob()) {
      const cover = Math.max(W / 1440, H / 810), u = Math.min(W / 1440, H / 900);
      let s, y;
      if (m === 'hero') { s = cover; y = 0; }
      else {
        const top = 66 * u, fit = (H - top - 28 * u - 70) / (762 - 79);
        if (fit >= cover) { s = cover; y = Math.min(0, Math.max(H - 810 * s, top - 79 * s)); }
        else { s = fit; y = top - 79 * fit; }
      }
      return { s, x: (W - 1440 * s) / 2, y };
    }
    if (m === 'hero') {
      const s = Math.min(W / 560, 0.72 * H / 810);
      return { s, x: W / 2 - 720 * s, y: H - 810 * s };
    }
    const navH = 18 + 46 + 16 + 42 + 14; // glass nav + prev/next row
    const uiBottom = 20 + ticket.offsetHeight + 18 + Math.max(60, desc.offsetHeight) + 14;
    const s = Math.min((W - 28) / 905, Math.max(0.2, (H - navH - uiBottom) / (762 - 95)));
    return { s, x: W / 2 - 720 * s, y: H - navH - 762 * s };
  }

  function fitHero(p) {
    const W = innerWidth, H = innerHeight;
    const vl = Math.max(0, -p.x / p.s), vr = Math.min(1440, (W - p.x) / p.s), pad = 18 / p.s;
    wm.style.left = (vl + 0.6 * pad) + 'px';
    wm.style.width = (vr - vl - 1.2 * pad) + 'px';
    badge.style.left = Math.min(986, vr - pad - 417) + 'px';
    const vb = Math.min(810, (H - p.y) / p.s);
    badge.style.top = Math.min(-165, vb - 56 / p.s - 935) + 'px';
    script.style.left = (vl + pad + 70) + 'px';
  }

  function place(m) {
    poseMode = m;

    setN();

    stage.classList.toggle('m-case', m === 'case');

  /* ---------- badge motion ---------- */
  function startSway(el) {
    clr(el);
    if (RM) return;
    el.animate([{ transform: 'rotate(-1.1deg)' }, { transform: 'rotate(1.1deg)' }],

  function entrance() {
    if (root.dataset.in) return;

      { duration: 900, delay: 1050, easing: 'cubic-bezier(.5,0,.3,1)' }));
    BD.forEach(e => {
      const a = an(e, [
        { opacity: 0, transform: 'translateY(-120%) rotate(8deg)' },
        { offset: .6, opacity: 1, transform: 'translateY(0) rotate(-3deg)' },
        { offset: .8, opacity: 1, transform: 'rotate(1.6deg)' },

  }

  /* ---------- case content ---------- */
  function fillCase(i) {
    const c = CASES[i];
    $('h2', ticket).textContent = c.t;
    $$('.rows div', ticket).forEach((d, k) => { d.textContent = c.rows[k]; });
    descKids[0].textContent = c.k;
    descKids[1].textContent = c.d;
    descKids[2].textContent = String(i + 1).padStart(2, '0') + ' / ' + String(CASES.length).padStart(2, '0');
    prevBtn.classList.toggle('dim', i === 0);
  }
  function preload() {}
  function playOnly(i) {
    vids.forEach((v, k) => { if (k !== i) v.classList.remove('run'); });
    const v = vids[i];
    v.classList.remove('run');
    void v.offsetWidth; // restart the typing animation
    v.classList.add('run');
  }
  function caseIn(i, first) {
    clr(ticket);
    an(ticket, [
      { opacity: 0, transform: 'translateY(-60px) rotate(-6deg)' },
      { offset: .7, opacity: 1, transform: 'translateY(6px) rotate(1.2deg)' },
      { opacity: 1, transform: 'none' }], { duration: 800, delay: first ? 150 : 0 });
    descKids.forEach((e, k) => {
      clr(e);
      an(e, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
        { duration: 600, delay: (first ? 250 : 80) + k * 70 });
    });
  }
  function caseOut() {
    clr(ticket);
    const all = [an(ticket, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-40px) rotate(4deg)' }],
      { duration: 380, easing: 'cubic-bezier(.5,0,.75,0)' })];
    descKids.forEach((e, k) => {
      clr(e);
      all.push(an(e, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-10px)' }],
        { duration: 300, delay: k * 40, easing: 'cubic-bezier(.5,0,.75,0)' }));
    });
    return Promise.all(all.map(done));
  }

  /* ---------- hero → laptop (simple crossfade) ---------- */
  async function toCase() {
    if (busy || mode !== 'hero') return;
    setBusy(true);
    entrance();
    heroOut();
    await wait(D(330));
    cur = 0;
    fillCase(0);
    preload(0);
    root.style.setProperty('--glide', '.9s');
    frame.classList.add('glide');
    place('case');
    clr(caseplate);
    caseplate.style.opacity = '1';
    await done(an(caseplate, [
      { opacity: 0, transform: 'scale(1.06)', filter: pf() + ' blur(10px)' },
      { opacity: 1, transform: 'scale(1)', filter: pf() + ' blur(0px)' }],
      { duration: 800, easing: 'cubic-bezier(.65,0,.35,1)' }));
    clr(caseplate);
    arriveCase();
  }

  function arriveCase() {
    mode = 'case';
    body.classList.add('is-case');
    clr(cut);
    cut.style.opacity = '0';
    screen.style.opacity = '1';
    an(flash, [{ opacity: 0 }, { opacity: .55 }, { opacity: 0 }], { duration: 600, easing: 'ease-out' });
    vids.forEach(clr);
    an(vids[0], [{ opacity: 0, transform: 'scale(1.06)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 700 });
    playOnly(0);
    caseIn(0, true);
    preload(1);
    setTimeout(() => { setBusy(false); frame.classList.remove('glide'); }, D(700));
  }

  /* ---------- switching cases ---------- */
  async function swapTo(n) {
    if (busy || mode !== 'case' || n === cur) return;
    setBusy(true);
    const old = vids[cur];
    clr(old);
    await Promise.all([caseOut(), done(an(old, [{ opacity: 1 }, { opacity: 0 }], { duration: 350 }))]);
    an(flash, [{ opacity: 0 }, { opacity: .35 }, { opacity: 0 }], { duration: 420, easing: 'ease-out' });
    cur = n;
    fillCase(n);
    const v = vids[n];
    clr(v);
    an(v, [{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 500 });
    playOnly(n);
    caseIn(n, false);
    preload((n + 1) % CASES.length);
    setTimeout(() => setBusy(false), D(520));
  }
  const next = () => swapTo(cur === CASES.length - 1 ? 0 : cur + 1);
  const prev = () => (cur === 0 ? toHero() : swapTo(cur - 1));

  /* ---------- back to hero ---------- */
  function toHero() {
    if (busy || mode !== 'case') return;
    setBusy(true);
    caseOut();
    done(an(screen, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 })).then(() => {
      screen.style.opacity = '0'; clr(screen); vids.forEach(clr);
    });

    mode = 'hero';
    body.classList.remove('is-case');
    root.style.setProperty('--glide', '.9s');
    frame.classList.add('glide');
    place('hero');

    clr(cut);
    cut.style.opacity = '1';
    an(cut, [
      { opacity: 0, transform: 'translateY(60px) scale(.96)', filter: 'blur(8px)' },
      { opacity: 1, transform: 'none', filter: 'blur(0px)' }], { duration: 900, delay: 150 });
    clr(caseplate);
    caseplate.style.opacity = '0';
    an(caseplate, [{ opacity: 1, filter: pf() + ' blur(0px)' }, { opacity: 0, filter: pf() + ' blur(12px)' }],
      { duration: 800, easing: 'cubic-bezier(.65,0,.35,1)' });

    setTimeout(heroIn, D(250));
    setTimeout(() => { setBusy(false); frame.classList.remove('glide'); }, D(1000));
  }

  /* ---------- input ---------- */
  const goDown = () => (mode === 'hero' ? toCase() : next());
  const goUp = () => { if (mode === 'case') prev(); };

  let lastWheel = 0;
  addEventListener('wheel', e => {
    e.preventDefault();
    if (Math.abs(e.deltaY) < 18) return;
    const now = performance.now();
    if (busy) { lastWheel = now; return; }
    if (now - lastWheel < 900) return;
    lastWheel = now;
    e.deltaY > 0 ? goDown() : goUp();
  }, { passive: false });

  let tx = 0, ty = 0, tOn = false;
  addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tOn = true; }, { passive: true });
  addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
  addEventListener('touchend', e => {
    if (!tOn) return; tOn = false;
    const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (mode === 'hero') { if (dy <= -40 && Math.abs(dy) > Math.abs(dx)) toCase(); return; }
    if (Math.abs(dx) > Math.abs(dy)) { if (dx <= -40) next(); else if (dx >= 40) prev(); }
    else { if (dy <= -40) next(); else if (dy >= 40) prev(); }
  }, { passive: true });

  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Spacebar') { e.preventDefault(); goDown(); }
    else if (k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); goUp(); }
    else if (k === 'ArrowRight') { e.preventDefault(); if (mode === 'case') next(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); if (mode === 'case') prev(); }
    else if (k === 'Home' || k === 'End') e.preventDefault();
  });

  $('.t1').addEventListener('click', () => toHero());
  $('.t2').addEventListener('click', () => toCase());
  $$('.t3, .t4').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  logo.addEventListener('click', () => toHero());
  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  $('.screen-hit').addEventListener('click', next);

  let rz = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(() => { frame.classList.remove('glide'); place(poseMode); });
  });

  /* ---------- theme toggle (circular reveal where supported) ---------- */
  themeBtn.addEventListener('click', () => {
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    const apply = () => {
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    };
    if (RM || !document.startViewTransition) { apply(); return; }
    const r = themeBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(apply).ready.then(() => {
      root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
        { duration: 650, easing: 'cubic-bezier(.65,0,.35,1)', pseudoElement: '::view-transition-new(root)' });
    }).catch(() => {});
  });

  /* ---------- language switch ---------- */
  const langBtn = $('.lang');
  function applyLang() {
    root.lang = LANG;
    document.title = L().title;
    $$('[data-i18n]').forEach(el => { el.textContent = L().ui[el.dataset.i18n]; });
    CASES = L().cases;
    renderSlides();
    fillCase(cur);
    if (mode === 'case') place('case');
  }
  langBtn.addEventListener('click', () => {
    LANG = LANG === 'en' ? 'vi' : 'en';
    try { localStorage.setItem('lang', LANG); } catch (e) {}
    applyLang();
  });

  /* ---------- boot ---------- */
  applyLang();
  place('hero');
  preload(0);
})();
</script>
</body>
</html>
